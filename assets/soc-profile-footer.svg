<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" role="img" aria-labelledby="title description">
  <title id="title">Open to defensive security collaboration</title>
  <desc id="description">A compact security operations footer inviting feedback, collaboration, and cybersecurity opportunities.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.58" stop-color="#0b1f2a"/>
      <stop offset="1" stop-color="#0b3b4a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#8ba8b7" stroke-opacity="0.07"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="170" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="170" fill="url(#background)"/>
    <rect width="1200" height="170" fill="url(#grid)"/>
    <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

    <g fill="none" stroke="#00b4d8" stroke-opacity="0.22" stroke-width="2">
      <path d="M 0 127 C 115 80 191 151 300 105 S 482 76 563 112"/>
      <path d="M 1200 43 C 1081 88 1010 21 900 66 S 728 91 646 55"/>
    </g>

    <g fill="#2dd4bf" filter="url(#glow)">
      <circle cx="176" cy="113" r="4">
        <animate attributeName="opacity" values="0.35;1;0.35" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1018" cy="60" r="4">
        <animate attributeName="opacity" values="1;0.3;1" dur="3.1s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(600 56)" font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
      <g transform="translate(-152 -33)">
        <rect width="304" height="26" rx="13" fill="#0e3342" stroke="#00b4d8" stroke-opacity="0.55"/>
        <circle cx="18" cy="13" r="3" fill="#2dd4bf">
          <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
        </circle>
        <text x="164" y="17.5" fill="#9eeaff" font-size="11" font-weight="700" letter-spacing="1.6">READY FOR THE NEXT INVESTIGATION</text>
      </g>
      <text y="28" fill="#f4f8fb" font-size="27" font-weight="700">Let&apos;s build better detections together.</text>
      <text y="61" fill="#a8c4d2" font-size="15" font-weight="600" letter-spacing="0.5">FEEDBACK  •  COLLABORATION  •  DEFENSIVE SECURITY OPPORTUNITIES</text>
    </g>

    <path d="M 70 29 H 116 M 70 29 V 61" fill="none" stroke="#00b4d8" stroke-opacity="0.7" stroke-width="2"/>
    <path d="M 1130 141 H 1084 M 1130 141 V 109" fill="none" stroke="#2dd4bf" stroke-opacity="0.7" stroke-width="2"/>
  </g>

  <rect x="1" y="1" width="1198" height="168" rx="21" fill="none" stroke="#4fd7ef" stroke-opacity="0.3" stroke-width="2"/>
</svg>
