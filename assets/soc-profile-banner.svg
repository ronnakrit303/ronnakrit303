<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Ronnakrit Woralakpakdee — Blue Team and SOC portfolio</title>
  <desc id="description">A dark security operations banner with an animated radar, signal paths, and Ronnakrit's focus areas.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b12"/>
      <stop offset="0.58" stop-color="#0b1f2a"/>
      <stop offset="1" stop-color="#0b3b4a"/>
    </linearGradient>
    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#00b4d8" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00b4d8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00b4d8" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#8ba8b7" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="320" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#background)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1015" cy="156" r="235" fill="url(#radar-glow)"/>
    <path d="M 0 286 C 240 245 390 330 635 286 S 970 224 1200 270 V 320 H 0 Z" fill="#07121b" fill-opacity="0.72"/>
    <path d="M 0 288 C 240 247 390 332 635 288 S 970 226 1200 272" fill="none" stroke="url(#accent-line)" stroke-width="2"/>

    <g opacity="0.7">
      <path d="M 42 78 V 48 H 60" fill="none" stroke="#00b4d8" stroke-width="2"/>
      <path d="M 364 48 H 382 V 78" fill="none" stroke="#00b4d8" stroke-width="2"/>
      <path d="M 1158 270 H 1124 M 1158 270 V 236" fill="none" stroke="#2dd4bf" stroke-width="2"/>
    </g>

    <g transform="translate(73 48)" font-family="Segoe UI, Arial, sans-serif">
      <rect width="278" height="30" rx="15" fill="#0e3342" stroke="#00b4d8" stroke-opacity="0.65"/>
      <circle cx="18" cy="15" r="4" fill="#2dd4bf" filter="url(#soft-glow)">
        <animate attributeName="opacity" values="0.45;1;0.45" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" fill="#9eeaff" font-size="12" font-weight="700" letter-spacing="1.8">SECURITY OPERATIONS PORTFOLIO</text>
    </g>

    <g font-family="Segoe UI, Arial, sans-serif" filter="url(#shadow)">
      <text x="72" y="142" fill="#f4f8fb" font-size="47" font-weight="750" letter-spacing="-1.2">Ronnakrit Woralakpakdee</text>
      <text x="74" y="181" fill="#a8c4d2" font-size="20" font-weight="600">SOC Analyst  •  Blue Team  •  Detection Engineering</text>
    </g>

    <g transform="translate(73 220)" font-family="Segoe UI, Arial, sans-serif">
      <circle cx="7" cy="7" r="6" fill="#2dd4bf" fill-opacity="0.16"/>
      <circle cx="7" cy="7" r="3" fill="#2dd4bf">
        <animate attributeName="r" values="2.5;4;2.5" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <text x="22" y="12" fill="#d5e6ee" font-size="14" font-weight="600" letter-spacing="0.4">OPEN TO CYBERSECURITY / SOC INTERNSHIPS</text>
    </g>

    <g transform="translate(1015 155)">
      <circle r="112" fill="#07131c" fill-opacity="0.48" stroke="#00b4d8" stroke-opacity="0.16"/>
      <circle r="83" fill="none" stroke="#39c4e3" stroke-opacity="0.28"/>
      <circle r="55" fill="none" stroke="#39c4e3" stroke-opacity="0.34"/>
      <circle r="27" fill="#0a2531" stroke="#2dd4bf" stroke-opacity="0.7"/>
      <path d="M -112 0 H 112 M 0 -112 V 112" stroke="#64d9ee" stroke-opacity="0.16"/>

      <g>
        <path d="M 0 0 L 0 -108 A 108 108 0 0 1 76 -76 Z" fill="#00b4d8" fill-opacity="0.13"/>
        <path d="M 0 0 V -108" stroke="#74e5f6" stroke-opacity="0.8" stroke-width="2"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </g>

      <g fill="#2dd4bf" filter="url(#soft-glow)">
        <circle cx="-49" cy="-31" r="4">
          <animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="64" cy="17" r="4">
          <animate attributeName="opacity" values="1;0.25;1" dur="3.4s" repeatCount="indefinite"/>
        </circle>
        <circle cx="21" cy="69" r="3">
          <animate attributeName="opacity" values="0.35;1;0.35" dur="2.2s" repeatCount="indefinite"/>
        </circle>
      </g>

      <path d="M -10 -11 L 0 -16 L 10 -11 V 1 C 10 10 4 16 0 18 C -4 16 -10 10 -10 1 Z" fill="none" stroke="#e8fbff" stroke-width="2"/>
      <path d="M -5 0 L -1 5 L 6 -4" fill="none" stroke="#2dd4bf" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="145" fill="#8db4c3" font-family="Consolas, monospace" font-size="11" text-anchor="middle" letter-spacing="2">MONITOR • DETECT • RESPOND</text>
    </g>

    <path d="M 650 70 C 760 70 780 115 862 115" fill="none" stroke="#00b4d8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="5 10">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="2.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#4fd7ef" stroke-opacity="0.28" stroke-width="2"/>
</svg>
